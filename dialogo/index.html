<!DOCTYPE html>
<html>
  <head>
    <meta charset=utf-8 />
    <title>Prueba1</title>
    
    <style>
      @font-face {
      font-family: "HelveticaNeue";
      src: url("HelveticaNeueLTStdRoman.otf");
      }

    p {
      font-family: "HelveticaNeue";
      font-size: 150%;
      }
      .cuadrado
      {
         width: 221px;
         height: 60px;
         background:antiquewhite;
         
         border: 1px hidden #FFFFFF;
          border-radius: 0px 7px 7px 7px;

          -webkit-box-shadow: 0px 10px 13px -7px #000000, 5px 0px 15px 5px rgba(0,0,0,0); 
          box-shadow: 0px 10px 13px -7px #000000, 5px 5px 15px 5px rgba(0,0,0,0);

          font-family: HelveticaNeue;
          font-size: 14px;
          letter-spacing: 0.2px;
          word-spacing: 0px;
          color: #000000;
          font-weight: 400;
          text-decoration: none solid rgb(68, 68, 68);
          font-style: normal;
          font-variant: normal;
          text-transform: none;

      }
      .contenidodinamico
      {
         width: 100px;
         height: 100px;
         background:antiquewhite;
         position: absolute;
         border: 1px hidden #FFFFFF;


      }

      .contenidodinamico.moviendo{
        animation-duration: 1s;
        animation-name: moviendo;
        animation-iteration-count: infinite;
        animation-direction: alternate;
        animation-timing-function: linear;
      }
      @keyframes moviendo {
        from {
          left: 0;
        }
        to {
          left: 400px;
        }
      }

      .triangulo-tricolor {
      width: 0; 
      height: 0; 
      border-left: 100px solid transparent;
      border-top: 50px solid antiquewhite;
      border-bottom: 50px solid transparent; 
      background-color: white;
 }

    </style>
    
  </head>
  
  <body>
    <p><button type="button" id="btnIniciar" onclick="mover()" >Iniciar</button></p>
    <div class="contenidodinamico" id="contenidodinamico" >
      <table border="0" >
        <tr >
          <td>
            <div id="triangulo-tricolor" class="triangulo-tricolor"></div>
          </td>
          <td>
            <div class="cuadrado" id="cuadrado" >Hola este es un cuadrado!</div>
          </td>
        </tr>
      </table>
      </div>


    
    <script>
      function mover()
      {
        document.getElementById('contenidodinamico').classList.add('moviendo');
      }
    </script>


  
                



  </body>
</html>
