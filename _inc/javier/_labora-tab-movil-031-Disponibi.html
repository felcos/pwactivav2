<script type="text/javascript">

$(document).ready(function(){

$("#bt_lanza").click(function(){
	var pantalla=  $(window).width() + " , " +$(window).height() ;
	var texto01 = $(".deal-navs").position().left + " , " +
				$(".deal-navs").position().right  ;
	$("#informaSize").html( pantalla);
	})
/* interruptor
$('a').click(function() {
  var clicks = $(this).data('clicks');
  if (clicks) {
    alert('odd number of clicks');
  } else {
    alert('even number of clicks');
  }
  $(this).data("clicks", !clicks);
});*/


	
	// $(".deal-navs").animate({   'left' : "-330px"   });
	
	$("#verSubmenu").on('click', function (e){
		e.preventDefault();
		
		  var clicks = $(this).data('clicks');
  
		  if (clicks) {
			$(".deal-navs").animate({   'right' : "0"   });
			$(this).find("span.ico").removeClass("icon-search").addClass("icon-arrow-left2 giro");
		  } else {
			$(".deal-navs").animate({   'right' : "-330px"   });
			$(this).find("span.ico").removeClass("icon-arrow-left2 giro").addClass("icon-search");
		  }
		  $(this).data("clicks", !clicks);
	 });
	 
	   



});
</script>
