<!DOCTYPE html>
<html>
  <head>
    <title>Simple click event</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
#map-canvas {
	height: 400px;
	width:600px;
	margin: 0px;
	padding: 0px
}
    </style>
</head>
<body>
<div id="map-canvas"></div>
<div id="informa">informa</div>
</body>
</html>
<script src="https://maps.googleapis.com/maps/api/js?v=3.exp&signed_in=false&region=ES"></script>
<script>
function initialize() {
	var mapOptions = {
		zoom: 4,
		center: new google.maps.LatLng(40.4947898, -3.3666759)	//Alcalá
	};
	
	var map = new google.maps.Map(document.getElementById('map-canvas'), mapOptions);
	
	var marker = new google.maps.Marker({
		position: map.getCenter(),
		map: map,
		title: 'Click to zoom'
	});
	
	google.maps.event.addListener(map, 'center_changed', function() {
		// 1 seconds after the center of the map has changed, pan back to the
		// marker.
		window.setTimeout(function() {
			map.panTo(marker.getPosition());
		}, 1000);
	});
	
	google.maps.event.addListener(marker, 'click', function() {
		map.setZoom(8);
		map.setCenter(marker.getPosition());
	});
}

google.maps.event.addDomListener(window, 'load', initialize);

</script>
