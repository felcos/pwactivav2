<!DOCTYPE html "-//W3C//DTD XHTML 1.0 Strict//EN" "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="https://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8"/>
    <title>Drag Zoom</title>
	<style>
#map {
	width: 700px;
	height: 400px;
	border: none;	/* 1px solid #000; */
}
    </style>
    <script type="text/javascript" src="https://maps.google.com/maps/api/js?sensor=false"></script>
    <script type="text/javascript" src="/test/mapas/keydragzoom/src/1.0-keydragzoom.js"></script>
    <script type="text/javascript">
        var map;
        function init() {
          var myOptions = {
            zoom: 12,
            center: new google.maps.LatLng(35.227, -80.84),
            mapTypeId: google.maps.MapTypeId.ROADMAP
          }
          var map = new google.maps.Map(document.getElementById("map"), myOptions);
          
          
          map.enableKeyDragZoom({
            key: 'ctrl'
          });
          
        }
    </script>
</head>
<body onload="init()">
    Presionar <span style="color:red; font-weight:bold">ctrl</span> y arrastrar dibujando una caja en el mapa
    <div id="map">
    </div>
</body>
</html>
