<!DOCTYPE html>
<html>
<head>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDX-HAhl6u-wxBKLQO31nH4vMUQ3w8cEoU&sensor=false&region=ES">
</script>

<script>
var geocoder;
var map;

function initialize() {
geocoder = new google.maps.Geocoder();

  var mapProp = {
	center:new google.maps.LatLng(40.4379543,-3.6795367),	//madrid
	zoom:11,
	mapTypeId:google.maps.MapTypeId.ROADMAP
  };
  map=new google.maps.Map(document.getElementById("googleMap"), mapProp);
};

google.maps.event.addDomListener(window, 'load', initialize);
//codeAddress();

function codeAddress() {
  //var address = document.getElementById('address').value;
  var address = "Toledo";
  geocoder.geocode( { 'address': address}, function(results, status) {
    if (status == google.maps.GeocoderStatus.OK) {
      map.setCenter(results[0].geometry.location);
      var marker = new google.maps.Marker({
          map: map,
          position: results[0].geometry.location
      });
    } else {
      alert('Geocode was not successful for the following reason: ' + status);
    }
  });
}
</script>
</head>

<body>
<input type="button" value="Toledo" onclick="codeAddress()">
<div id="googleMap" style="width:800px;height:600px;"></div>

</body>
</html>
